<section class="login-page">
    <div class="floating-shape shape-1"></div>
    <div class="floating-shape shape-2"></div>
    <div class="floating-shape shape-3"></div>

    <div class="login-card">
        <button class="info-button" (click)="showInfo()" type="button" title="Information">
            <span>i</span>
        </button>
        <div class="brand">
            <div class="brand-mark">A</div>
            <div>
                <p class="brand-name">Attendo</p>
                <p class="brand-subtitle">Smarter attendance, faster.</p>
            </div>
        </div>

        @if (!showForgotPassword) {
        <h1 class="title">Welcome back</h1>
        <p class="subtitle">Sign in to access your dashboard.</p>

        <form (ngSubmit)="login()">
            <div class="field">
                <label class="label">Email</label>
                <div class="control with-icon">
                    <span class="icon">@</span>
                    <input [(ngModel)]="email" name="email" class="input" type="email"
                        placeholder="you@example.com" required>
                </div>
            </div>

            <div class="field">
                <label class="label">Password</label>
                <div class="control with-icon">
                    <span class="icon">•••</span>
                    <input [(ngModel)]="password" name="password" class="input" type="password"
                        placeholder="Enter password" required>
                </div>
            </div>

            <div class="field actions">
                <label class="remember">
                    <input type="checkbox"> Keep me signed in
                </label>
                    <a class="link" href="#" (click)="toggleForgotPassword($event)">Forgot password?</a>
            </div>

            <button type="submit" (click)="login()" class="button primary">
                Sign in
            </button>
        </form>
        } @else {
            <h1 class="title">Reset Password</h1>
            <p class="subtitle">Enter your email address and we'll send you a link to reset your password.</p>

            <form (ngSubmit)="submitForgotPassword()">
                <div class="field">
                    <label class="label">Email</label>
                    <div class="control with-icon">
                        <span class="icon">@</span>
                        <input [(ngModel)]="forgotPasswordEmail" name="forgotPasswordEmail" class="input" type="email"
                            placeholder="you@example.com" required [disabled]="isLoading">
                    </div>
                </div>

                <div class="field actions">
                    <a class="link" href="#" (click)="toggleForgotPassword($event)">Back to login</a>
                </div>

                <button type="submit" class="button primary" [disabled]="isLoading">
                    @if (isLoading) {
                        Sending...
                    } @else {
                        Send Reset Link
                    }
                </button>
            </form>
        }
    </div>
</section>
